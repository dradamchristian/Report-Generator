<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Phone dictation</title>
  <link rel="stylesheet" href="assets/styles.css"/>
</head>
<body>
  <main class="wrap">
    <h1>Send dictation to PC</h1>
    <p class="muted">Use iPhone dictation in the keyboard, then press <b>Send to PC</b>.</p>

    <label for="phoneText">Text</label>
    <textarea id="phoneText" rows="6" placeholder="Tap the mic on the iPhone keyboard and dictate here…"></textarea>

    <div class="btnrow">
      <button id="btnSend">Send to PC</button>
      <button id="btnCopy" class="secondary">Copy</button>
    </div>

    <div class="status" id="status"></div>

    <hr style="border:0;border-top:1px solid var(--border); margin:18px 0; opacity:.7"/>

    <p class="muted">This page only works when opened from a session link created on the PC page.</p>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const sessionId = decodeURIComponent((location.hash || "").replace(/^#/, ""));

function setStatus(msg){ $("status").textContent = msg || ""; }

async function copyText(text){
  await navigator.clipboard.writeText(text || "");
  setStatus("Copied.");
  setTimeout(() => setStatus(""), 1200);
}

async function send(){
  const text = $("phoneText").value.trim();
  if(!sessionId){ setStatus("Missing session id. Go back to the PC and click 'Dictate from phone'."); return; }
  if(!text){ setStatus("Dictate or type some text first."); return; }

  setStatus("Sending…");
  const res = await fetch("/.netlify/functions/phone-send-text", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ sessionId, text })
  });
  const data = await res.json();
  if(!res.ok){ setStatus("Error: " + (data.error || "failed")); return; }
  setStatus("Sent ✅ You can return to the PC.");
}

window.addEventListener("DOMContentLoaded", () => {
  $("btnSend").addEventListener("click", send);
  $("btnCopy").addEventListener("click", () => copyText($("phoneText").value));
});
</script>
</body>
</html>
